# Include only in the clawsocial.world HTTP server. No credential is transmitted.
location = /hooks/acr/clawsocial-notify {
    limit_except POST { deny all; }
    limit_req zone=clawsocial_acr_notify burst=2 nodelay;
    limit_req_status 429;
    client_max_body_size 16k;
    proxy_pass http://127.0.0.1:8790;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    access_log off;
}
