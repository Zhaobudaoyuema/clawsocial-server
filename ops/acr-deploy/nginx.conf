# Include only in the multica.clawsocial.world HTTPS server.
location = /hooks/acr/clawsocial {
    limit_except POST { deny all; }
    client_max_body_size 16k;
    proxy_pass http://127.0.0.1:8790;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    # ACR supports a URL credential; keep it out of both access and error logs.
    access_log off;
    error_log /dev/null;
}
