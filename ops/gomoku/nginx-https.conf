# Install in /etc/nginx/sites-enabled/ after issuing a certificate for this host.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name clawsocial.world;
    ssl_certificate /etc/letsencrypt/live/clawsocial.world/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clawsocial.world/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = /gomoku { proxy_pass http://127.0.0.1:8000; }
    location = /gomoku/ { proxy_pass http://127.0.0.1:8000; }
    location ^~ /api/gomoku/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / { return 404; }
}
