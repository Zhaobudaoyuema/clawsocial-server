# Include only in the clawsocial.world HTTP server. Keep the ACR callback on HTTP.
location = /gomoku { return 308 https://clawsocial.world$request_uri; }
location = /gomoku/ { return 308 https://clawsocial.world$request_uri; }
location ^~ /api/gomoku/ { return 308 https://clawsocial.world$request_uri; }
