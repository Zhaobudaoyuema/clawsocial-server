<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>五子棋 · 快速代下</title><style>
:root{--ink:#273a30;--green:#426b50;--muted:#849087;--paper:#faf8f1;--line:#e5e5d9}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:system-ui,-apple-system,"PingFang SC","Microsoft Yahei",sans-serif;background:radial-gradient(ellipse at 5% 95%,#e5ecdc,transparent 38%),radial-gradient(ellipse at 95% 5%,#f1ebda,transparent 40%),var(--paper);min-height:100vh}button,a{touch-action:manipulation}button{font:inherit;cursor:pointer;border:1px solid #d6ddcf;border-radius:11px;padding:10px 17px;background:#fffdf7;color:var(--ink);transition:.15s}button:hover{border-color:var(--green);background:#f0f4e9}button:disabled{opacity:.45;cursor:default}button.primary{background:var(--green);color:white;border-color:var(--green)}button.quiet{border:0;background:transparent;padding:6px 10px;color:#647267}.top{height:82px;max-width:1320px;margin:auto;padding:0 35px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{display:flex;gap:12px;align-items:center}.logo{font-size:29px;letter-spacing:-8px;padding-right:8px}.brand h1{font:700 26px Georgia,"Songti SC",serif;margin:0;letter-spacing:3px}.brand small{color:#788373;font-size:13px;letter-spacing:1px}.top-actions{display:flex;align-items:center;gap:13px;font-size:14px}.switch{display:flex;align-items:center;gap:8px;cursor:pointer}.switch input{accent-color:var(--green);width:18px;height:18px}main{max-width:1250px;margin:30px auto;display:grid;grid-template-columns:minmax(400px,760px) minmax(300px,390px);gap:25px;padding:0 26px}.play-area{background:#fffcf4d9;border:1px solid #e6e1d3;border-radius:24px;padding:24px;box-shadow:0 12px 40px #54462108}.players{display:flex;align-items:center;justify-content:space-between;margin:0 0 22px;gap:8px}.player{display:flex;gap:11px;align-items:center;min-width:100px}.avatar{width:46px;height:46px;background:#e8ddc2;border-radius:50%;display:grid;place-items:center;font-size:24px}.avatar.ai{background:#e1e9dd;color:#497158}.player strong{display:block;font-size:17px}.player small{font-size:12px;color:#879083}.disc{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:middle;margin-right:4px}.black{background:#26302b}.white{background:#fff;border:1px solid #b7b9b0}.turn{text-align:center}.turn b{display:block;background:#edf1e4;padding:7px 17px;border-radius:30px;color:#46683d;font-size:14px}.turn small{display:block;margin-top:8px;font-size:11px;color:#83917d}.board-frame{padding:12px;border-radius:18px;background:linear-gradient(135deg,#efcc92,#dbaa63);border:1px solid #cfa869;box-shadow:inset 0 0 0 3px #f9dfad,0 7px 16px #87602812}.board{position:relative;aspect-ratio:1;background:repeating-linear-gradient(95deg,#e5bc7908 0 3px,#ad772312 4px,#e5bc7910 5px 19px),linear-gradient(100deg,#efd09c,#e5bb79);border-radius:9px;width:100%}canvas{display:block;width:100%;height:100%;touch-action:manipulation;cursor:crosshair;border-radius:9px}.board-status{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:18px 25px;border:1px solid #ded9c5;border-radius:16px;background:#fffdf3f2;text-align:center;box-shadow:0 5px 25px #46371715;min-width:200px}.board-status b{display:block;margin-bottom:7px}.board-status small{color:#7b826f}.board-status[hidden]{display:none}.controls{display:flex;justify-content:space-between;margin-top:22px;gap:10px;flex-wrap:wrap}.controls>div{display:flex;gap:8px}.caption{font-size:12px;color:#8e9488;text-align:center;margin:17px 0 0}.sidebar{display:flex;flex-direction:column;gap:17px}.card{border:1px solid #e1e3d7;border-radius:20px;background:#fffdf8;overflow:hidden;box-shadow:0 7px 28px #54462105}.card-title{padding:19px 21px;display:flex;align-items:center;justify-content:space-between;background:#eef2e7;border-bottom:1px solid #e2e7da}.card-title h2{font-size:18px;margin:0;letter-spacing:1px}.pill{font-size:11px;border-radius:20px;background:#fffdf6;padding:5px 10px;color:#6f7d64}.card-body{padding:21px}.section-label{font-size:12px;letter-spacing:1px;color:#738268;margin-bottom:9px}.lesson{font-size:14px;line-height:1.9;margin:0;white-space:pre-wrap;overflow-wrap:anywhere}.lesson.empty{color:#919887}.divider{height:1px;background:#e9ebdf;margin:22px 0}.tip{font-size:12px;line-height:1.8;color:#77816e;background:#f4f4e9;border-radius:10px;padding:11px 13px;margin-top:18px}.lesson-actions{display:flex;gap:9px;margin-top:18px}.lesson-actions button{font-size:12px;padding:9px 11px}.connect-text{font-size:13px;line-height:1.9;color:#79816e;margin:0 0 14px}.connect-buttons{display:flex;gap:8px;flex-wrap:wrap}.connect-buttons button{font-size:12px}.connection{font-size:12px;color:#89917e;margin-top:14px;line-height:1.8}.connection.ready{color:#427347}details{border-top:1px solid var(--line)}summary{padding:17px 21px;cursor:pointer;font-size:13px;color:#68775d}.history{max-height:270px;overflow:auto;font-size:12px;line-height:1.8;padding:0 21px 18px;white-space:pre-wrap}.foot{text-align:center;font-size:11px;letter-spacing:1px;color:#9da391;margin:0 0 25px}.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#2e493e;color:#fff;padding:13px 23px;border-radius:12px;font-size:13px;z-index:20;box-shadow:0 5px 25px #0002;max-width:90vw}.toast[hidden]{display:none}dialog{border:1px solid #dedfce;border-radius:22px;background:#fffdf5;color:var(--ink);padding:28px;max-width:440px;width:calc(100% - 32px);box-shadow:0 20px 80px #0002}dialog::backdrop{background:#20302555;backdrop-filter:blur(3px)}dialog h2{margin:0 0 13px;font-size:23px}dialog p{font-size:14px;line-height:1.9;color:#7b816e}dialog .row{display:flex;gap:10px;margin:20px 0}dialog .row button{flex:1}dialog .selected{border:2px solid var(--green);background:#edf2e5}textarea{width:100%;min-height:100px;padding:10px;border:1px solid #d8decd;border-radius:10px;font:12px monospace;background:#f7f7ee;color:#41563e}#banner{font-size:12px;color:#7c684a;background:#f3ecdc;padding:10px 16px;border-radius:10px;margin-bottom:16px;line-height:1.8}#banner:empty{display:none}.eyebrow{font-size:11px;letter-spacing:2px;color:#97a087;margin-bottom:8px}.agent-note{font-size:12px;padding:12px;border-radius:10px;background:#edf2e7;line-height:1.7;margin-bottom:15px}

main{display:block;max-width:1160px;padding:0 20px}.play-area{padding:20px}.board-frame{max-width:min(560px,calc(100dvh - 330px));margin:auto}.sidebar{margin-top:18px}.connect-panel{display:flex;gap:15px;align-items:center;justify-content:space-between;flex-wrap:wrap}.connect-panel p{margin:0}.latest{font-size:28px;letter-spacing:1px}.status-bar{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:18px}.status-bar small{color:var(--muted)}.history{max-height:180px}.invite-url{min-height:82px}.countdown{font-size:20px;font-weight:700;color:var(--green);font-variant-numeric:tabular-nums}.countdown.urgent{color:#e63946}.countdown[hidden]{display:none}

</style></head><body>
<header class="top"><div class="brand"><span class="logo" aria-hidden="true">●○</span><div><h1>五子棋</h1><small>你录入对手 · Codex 替你下</small></div></div><button id="newGame">新棋局</button></header>
<main><section class="play-area"><div id="banner" role="status"></div>
<div class="players"><div class="player"><div class="avatar ai">✳</div><div><strong>我方 · Codex</strong><small id="ownColor">选择颜色</small></div></div><div class="turn"><b id="turn">准备开始</b><small id="presence">等待连接</small></div><div class="player"><div><strong>对手</strong><small id="opponentColor">你来录入</small></div></div></div>
<div class="status-bar"><div><small>我方最新落点</small><div class="latest" id="latest">—</div></div><div><div id="countdown" class="countdown" role="timer" hidden></div><small id="moveCount">15×15 · 中心 H8</small></div></div>
<div class="board-frame"><div class="board"><canvas id="board" aria-label="15乘15五子棋棋盘，可用方向键移动、回车录入对手落子" tabindex="0"></canvas><div class="board-status" id="startOverlay"><b>选择我方颜色</b><small>我方落子由 Codex 完成</small><p><button class="primary" id="start">开始</button></p></div></div></div>
<div class="controls"><div><button id="undo" disabled>撤销本轮</button><button id="reset" disabled>清空重来</button></div><button id="invite">连接 Codex</button></div><p class="caption">15×15 · 黑棋先行 · 连五获胜 · 无禁手</p>
</section><section class="card sidebar"><div class="card-body connect-panel"><p class="connect-text" id="hint">创建棋局后，把连接链接交给 Codex，随后只需录入对手落子。</p><div class="connection" id="capability">正在检测工具…</div></div><details><summary>棋谱</summary><div class="history" id="history">暂无记录</div></details></section></main>
<div id="toast" class="toast" role="status" hidden></div>
<dialog id="newDialog"><h2>我方执什么颜色？</h2><p>黑棋先手：自动落中心 H8。白棋后手：先录入对方第一步。</p><div class="row"><button class="selected" id="chooseBlack">● 黑棋 · 先手</button><button id="chooseWhite">○ 白棋 · 后手</button></div><div class="row"><button id="cancelNew">取消</button><button class="primary" id="create">创建棋局</button></div></dialog>
<dialog id="connectDialog"><h2>连接 Codex</h2><p>把下面的链接发给 Codex，让它替我方下棋；你在此页录入对手的落子。</p><textarea id="inviteUrl" class="invite-url" readonly aria-label="Codex 连接链接"></textarea><div class="row"><button id="copyInvite" class="primary">复制链接</button><button id="closeConnect">关闭</button></div></dialog>
<script type="module">
const $=id=>document.getElementById(id),COLS='ABCDEFGHIJKLMNO';
let room=null,game=null,agentToken='',chosen='black',focus=[7,7],pending=false,polling=false,serverClockOffset=0;
const canvas=$('board'),ctx=canvas.getContext('2d');let dpr=1,size=600,pad=35,step=38;
function toast(message){$('toast').textContent=message;$('toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').hidden=true,3000)}
function save(){sessionStorage.setItem('gomoku-current',JSON.stringify(room))}
function loadLink(){try{const p=new URLSearchParams(location.hash.slice(1));room=p.has('room')&&p.has('token')?{id:p.get('room'),token:p.get('token'),role:p.get('role')==='agent'?'agent':'human'}:JSON.parse(sessionStorage.getItem('gomoku-current')||'null');if(room)save()}catch{room=null}}
async function api(path,options={}){const response=await fetch('/api/gomoku/'+path,{...options,headers:{'Content-Type':'application/json','X-Gomoku-Token':room?.token||''}});const data=await response.json();if(!response.ok)throw Error(data.detail||'请求失败');return data}
function update(g){if(game?.id===g.id&&g.revision<game.revision)return game;if(Number.isFinite(g.serverTime))serverClockOffset=Date.now()/1000-g.serverTime;game=g;render();return g}
async function refresh(){return room?update(await api('rooms/'+room.id)):null}
async function act(action,extra={}){if(!room||!game)throw Error('请先创建棋局');return update(await api('rooms/'+room.id+'/actions',{method:'POST',body:JSON.stringify({action,expectedRevision:game.revision,...extra})}))}
function draw(){const rect=canvas.getBoundingClientRect();size=rect.width;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(size*dpr);canvas.height=Math.round(size*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);pad=size*.062;step=(size-pad*2)/14;ctx.clearRect(0,0,size,size);ctx.strokeStyle='#886b43';ctx.lineWidth=.65;for(let i=0;i<15;i++){let n=pad+i*step;ctx.beginPath();ctx.moveTo(pad,n);ctx.lineTo(size-pad,n);ctx.moveTo(n,pad);ctx.lineTo(n,size-pad);ctx.stroke()}ctx.fillStyle='#745a37';ctx.font=`${Math.max(9,size*.021)}px Georgia`;ctx.textAlign='center';ctx.textBaseline='middle';for(let i=0;i<15;i++){ctx.fillText(COLS[i],pad+i*step,size-pad*.35);ctx.fillText(String(15-i),pad*.37,pad+i*step)}for(const [a,b] of [[3,3],[7,7],[11,3],[3,11],[11,11]]){ctx.beginPath();ctx.arc(pad+a*step,pad+b*step,2.5,0,Math.PI*2);ctx.fill()}const selected=new Set();for(const m of game?.moves||[]){const x=COLS.indexOf(m.at[0]),y=Number(m.at.slice(1))-1,cx=pad+x*step,cy=pad+(14-y)*step,r=step*.425;ctx.save();ctx.shadowColor='#3d2a1840';ctx.shadowBlur=4;ctx.shadowOffsetY=2;const g=ctx.createRadialGradient(cx-r*.35,cy-r*.4,r*.1,cx,cy,r);g.addColorStop(0,m.color==='black'?'#657068':'#fffef5');g.addColorStop(1,m.color==='black'?'#17201b':'#d8d6c8');ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();ctx.restore();if(selected.has(m.at)||game.winningLine.includes(m.at)){ctx.strokeStyle='#608c4b';ctx.lineWidth=3;ctx.beginPath();ctx.arc(cx,cy,r+2,0,Math.PI*2);ctx.stroke()}if(m===game.moves.at(-1)){ctx.fillStyle=m.color==='black'?'#e3e8d7':'#537546';ctx.beginPath();ctx.arc(cx,cy,Math.max(2,r*.16),0,Math.PI*2);ctx.fill()}}if(document.activeElement===canvas){ctx.strokeStyle='#fff9';ctx.lineWidth=2;ctx.strokeRect(pad+focus[0]*step-step*.44,pad+(14-focus[1])*step-step*.44,step*.88,step*.88)}}
function secondsLeft(g){return g.moveDeadline==null?null:Math.max(0,Math.ceil(g.moveDeadline-(Date.now()/1000-serverClockOffset)))}
function renderCountdown(){
 const remaining=game?secondsLeft(game):null;
 $('countdown').hidden=remaining===null;
 $('countdown').classList.toggle('urgent',remaining!==null&&remaining<=5);
 $('countdown').textContent=remaining===null?'':remaining>0?'快速落子 · 剩余 '+remaining+'s':'已超时 · 请立即落子';
}
function render(){
 renderCountdown();draw();if(!game)return;
 const relay=game.mode==='relay',own=game.agentColor;
 $('startOverlay').hidden=true;
 $('ownColor').textContent=own==='black'?'● 黑棋':'○ 白棋';
 $('opponentColor').textContent=game.humanColor==='black'?'● 黑棋 · 你来录入':'○ 白棋 · 你来录入';
 const ourTurn=game.nextColor===own;
 const label=game.status==='playing'?(ourTurn?'Codex 选点中…':'请录入对手落子'):game.status==='draw'?'和棋':game.winner===own?'我方获胜':'对手获胜';
 $('turn').textContent=label;$('presence').textContent=game.agentOnline?'● Codex 已连接':'○ 等待 Codex 连接';
 $('latest').textContent=game.moves.filter(m=>m.color===own).at(-1)?.at||'—';
 $('moveCount').textContent='第 '+game.moves.length+' 手';
 $('banner').textContent=!relay?'这是旧版对弈棋局，请点“新棋局”开始代下。':room.role==='agent'?'Codex 连接页；录入对手请使用创建棋局的页面。':'';
 $('hint').textContent=game.status!=='playing'?'本局结束，可查看棋谱或新建棋局。':ourTurn?'等待 Codex 落子；落点出现后，同步到腾讯小程序。':'点击棋盘，录入腾讯小程序中对手刚下的位置。';
 $('reset').disabled=pending||room.role!=='human'||!relay;
 $('undo').disabled=$('reset').disabled||game.moves.length<=(own==='black'?1:0);
 $('invite').disabled=!agentToken;
 $('history').textContent=game.moves.map(m=>m.number+'. '+(m.color==='black'?'黑 ':'白 ')+m.at).join('  ·  ')||'暂无记录';
 canvas.setAttribute('aria-label',`15乘15五子棋棋盘，第${game.moves.length}手，${label}`);
}
async function move(at){
 if(pending||!game)return;
 if(room.role!=='human'||game.mode!=='relay')return toast('请使用录入页面或创建新棋局');
 if(!game.yourTurn)return toast('等待 Codex 落子后，再录入对手');
 pending=true;try{await act('move',{move:at})}catch(e){toast(e.message);await refresh().catch(()=>{})}finally{pending=false;render()}
}
canvas.addEventListener('click',e=>{const r=canvas.getBoundingClientRect(),x=Math.round((e.clientX-r.left-pad)/step),y=14-Math.round((e.clientY-r.top-pad)/step);if(x>=0&&x<15&&y>=0&&y<15){focus=[x,y];move(COLS[x]+(y+1))}});
canvas.addEventListener('keydown',e=>{const dirs={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,1],ArrowDown:[0,-1]};if(dirs[e.key]){e.preventDefault();focus=focus.map((n,i)=>Math.max(0,Math.min(14,n+dirs[e.key][i])));draw()}else if(e.key==='Enter'||e.key===' '){e.preventDefault();move(COLS[focus[0]]+(focus[1]+1))}});
canvas.addEventListener('focus',draw);canvas.addEventListener('blur',draw);new ResizeObserver(draw).observe(canvas);
$('start').onclick=$('newGame').onclick=()=>$('newDialog').showModal();
for(const color of ['black','white'])$('choose'+(color==='black'?'Black':'White')).onclick=()=>{chosen=color;$('chooseBlack').classList.toggle('selected',color==='black');$('chooseWhite').classList.toggle('selected',color==='white')};
$('cancelNew').onclick=()=>$('newDialog').close();
$('create').onclick=async()=>{if(pending)return;pending=true;$('create').disabled=true;try{
 const r=await api('rooms',{method:'POST',body:JSON.stringify({mode:'relay',ownColor:chosen})});
 room={id:r.id,token:r.humanToken,role:'human'};agentToken=r.agentToken;focus=[7,7];save();sessionStorage.setItem('gomoku-invite:'+r.id,agentToken);
 location.hash=new URLSearchParams({room:room.id,token:room.token,role:room.role}).toString();
 await refresh();$('newDialog').close();openConnect();
}catch(e){toast(e.message)}finally{pending=false;$('create').disabled=false;render()}};
function openConnect(){if(!room)return $('newDialog').showModal();if(!agentToken)return toast('请在创建棋局的原标签页获取链接');$('inviteUrl').value=location.origin+'/gomoku#'+new URLSearchParams({room:room.id,token:agentToken,role:'agent'});$('connectDialog').showModal()}
$('invite').onclick=openConnect;$('closeConnect').onclick=()=>$('connectDialog').close();
$('copyInvite').onclick=async()=>{try{await navigator.clipboard.writeText($('inviteUrl').value);toast('已复制')}catch{$('inviteUrl').select();toast('请复制上方链接')}};
$('undo').onclick=async()=>{try{await act('undo')}catch(e){toast(e.message)}};
$('reset').onclick=async()=>{if(confirm('清空本局并重新开始？'))try{await act('reset')}catch(e){toast(e.message)}};
function context(g){
 if(g.timeout)return {revision:g.revision,timeout:true};
 const data={revision:g.revision,you:g.agentColor,yourTurn:g.role==='agent'&&g.yourTurn,
   black:g.moves.filter(m=>m.color==='black').map(m=>m.at).join(' '),
   white:g.moves.filter(m=>m.color==='white').map(m=>m.at).join(' ')};
 const remaining=secondsLeft(g);if(remaining!==null)data.secondsLeft=remaining;
 if(g.status!=='playing'){data.status=g.status;data.winner=g.winner}
 const threats=g.immediateWinningMoves;
 if(threats[g.agentColor].length)data.win=threats[g.agentColor];
 if(threats[g.humanColor].length)data.block=threats[g.humanColor];
 return data;
}
function toolResult(data){return {content:[{type:'text',text:JSON.stringify(data)}]}}
async function registerTools(){
 if(!isSecureContext){$('capability').textContent='请使用 HTTPS 连接 Codex';return}
 const mc=document.modelContext?.registerTool?document.modelContext:navigator.modelContext;
 if(!mc?.registerTool){$('capability').textContent='在支持 WebMCP 的 Codex 客户端打开连接链接';return}
 const agent=()=>{if(room?.role!=='agent'||game?.mode!=='relay')throw Error('请先打开代下棋局的 Codex 连接链接')};
 const tools=[
 {name:'get_turn',description:'固定15×15棋盘，坐标A1–O15，A1左下、O15右上、H8中心；字母向右递增、数字向上递增。black/white为空格分隔的已占坐标，未列出的点为空，五子及以上获胜、无禁手。you是我方颜色，你替用户下棋，用户录入对方。先看win直接赢，否则处理block，再检查对方能否形成两端开放的四子。用secondsLeft把握本轮15秒时间，立即调用play_turn，不解释、不播报、不截图。status省略表示playing；get_turn用于初次读取或冲突后重新同步。',inputSchema:{type:'object',properties:{}},execute:async()=>{if(room?.role!=='agent')throw Error('请打开 Codex 连接链接');const g=update(await api('rooms/'+room.id+'/actions',{method:'POST',body:JSON.stringify({action:'heartbeat',expectedRevision:0})}));agent();return toolResult(context(g))}},
 {name:'play_turn',description:'在我方空位落子，只传move和最新revision对应的expectedRevision。成功只返回revision/played确认，不重复棋盘。随后用该revision调用wait_for_turn；冲突时调用get_turn同步。',inputSchema:{type:'object',properties:{move:{type:'string',description:'A1-O15'},expectedRevision:{type:'integer'}},required:['move','expectedRevision']},execute:async args=>{agent();const g=await act('move',args);return toolResult({revision:g.revision,played:args.move,...(g.status!=='playing'?{status:g.status,winner:g.winner}:{})})}},
 {name:'wait_for_turn',description:'等待对手录入，最多15秒；这不是思考等待时间，有新落子会立即返回黑白坐标列表和secondsLeft。timeout=true仅表示未变化，继续等；yourTurn=true立即选点并play_turn，不再get_turn。坐标与固定规则同get_turn。',inputSchema:{type:'object',properties:{afterRevision:{type:'integer'}},required:['afterRevision']},execute:async({afterRevision})=>{agent();const g=update(await api('rooms/'+room.id+'/turn?afterRevision='+encodeURIComponent(afterRevision)+'&timeout=15'));return toolResult(context(g))}}
 ];
 try{for(const tool of tools)await mc.registerTool(tool);$('capability').textContent='✓ Codex 读盘与落子工具就绪';$('capability').classList.add('ready')}catch(e){$('capability').textContent='工具注册失败：'+e.message}
}
addEventListener('hashchange',()=>{const p=new URLSearchParams(location.hash.slice(1));if(p.has('room')&&p.has('token')&&(!room||p.get('room')!==room.id||p.get('token')!==room.token))location.reload()});
loadLink();
if(room){agentToken=sessionStorage.getItem('gomoku-invite:'+room.id)||'';refresh().catch(e=>toast(e.message))}
registerTools();
setInterval(renderCountdown,100);
setInterval(async()=>{if(polling||pending||!room||room.role==='agent'||document.hidden)return;polling=true;try{await refresh()}catch{ $('presence').textContent='连接中断，正在重试' }finally{polling=false}},400);
draw();
</script></body></html>
